name: terraform-practice

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  id-token: write # lets the job request an OIDC token for Azure login
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest # practice only; the real private deployment needs a self-hosted runner
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - run: terraform fmt -check

      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=practice-nonprod.tfstate"

      - run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan (short retention)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: nonprod # the approval gate is configured on this GitHub Environment
    concurrency:
      group: tf-apply-nonprod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=practice-nonprod.tfstate"

      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
